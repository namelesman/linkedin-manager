name: Publicar posts agendados

on:
  schedule:
    # O GitHub pode atrasar alguns minutos em horários de pico.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-cron
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar /api/cron/publish
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure os secrets APP_URL e CRON_SECRET no repositório." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/publish"
